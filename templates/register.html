{% extends "base.html" %}

{% block title %}Create Account — Personal Expense Tracker{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      
      <div class="tracker-card">
        <!-- Header Strip -->
        <div class="tracker-card-header text-center">
          <span class="tracker-header-title">Create Private Account</span>
        </div>

        <div class="p-4">
          <p class="text-muted text-center mb-4" style="font-family: 'Patrick Hand', cursive; font-size: 1.25rem;">
            Set up your username &amp; password to keep your records private
          </p>

          <form action="{{ url_for('register') }}" method="POST" id="registerForm">
            <!-- Username Input -->
            <div class="mb-3">
              <label for="usernameInput" class="doodle-label">Choose Username</label>
              <div class="doodle-input-wrap">
                <input type="text" class="doodle-input ps-3" id="usernameInput" name="username" placeholder="e.g. joel" value="{{ username or '' }}" required autofocus>
              </div>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
              <label for="passwordInput" class="doodle-label">Password</label>
              <div class="doodle-input-wrap">
                <input type="password" class="doodle-input ps-3" id="passwordInput" name="password" placeholder="At least 4 characters" required>
              </div>
            </div>

            <!-- Confirm Password Input -->
            <div class="mb-4">
              <label for="confirmPasswordInput" class="doodle-label">Confirm Password</label>
              <div class="doodle-input-wrap">
                <input type="password" class="doodle-input ps-3" id="confirmPasswordInput" name="confirm_password" placeholder="Re-type password" required>
              </div>
            </div>

            <!-- Form Submit Button -->
            <button type="submit" class="btn-doodle-primary w-100 py-2.5 mb-3">
              <span>Create Account</span>
            </button>

            <div class="text-center pt-2 border-top border-ink-light">
              <p class="mb-2 text-muted small" style="font-family: 'Patrick Hand', cursive; font-size: 1.1rem;">
                Already have an account?
              </p>
              <a href="{{ url_for('login') }}" class="btn-doodle-secondary d-block w-100">
                <span>Sign In Here</span>
              </a>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
